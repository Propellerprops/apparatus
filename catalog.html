<style>
  :root{--ink:#101011;--panel:#1a1a1c;--paper:#f0f0f0;--gold:#ED1C24;--mute:#98958c;--line:#2c2c2e;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--ink);color:var(--paper);font-family:'Space Grotesk',"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-weight:300;}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(16,16,17,.94);backdrop-filter:blur(8px);z-index:40;}
  header svg{height:20px;color:var(--paper);}
  header .tag{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mute);}
  main{max-width:1180px;margin:0 auto;padding:48px 24px 140px;}
  .eyebrow{color:var(--gold);font-size:12px;letter-spacing:4px;text-transform:uppercase;}
  h1{font-size:clamp(26px,4vw,42px);font-weight:400;margin:14px 0 10px;}
  .lead{color:var(--mute);font-size:16px;line-height:1.7;max-width:620px;}

  .feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin:40px 0 70px;}
  .fcard{border:1px solid var(--line);display:flex;flex-direction:column;transition:border-color .25s;position:relative;}
  .ph{aspect-ratio:4/3;background:#1d1d1f;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .ph i{font-size:44px;color:var(--gold);opacity:.55;}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;}
  .fbody{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .fcard:hover{border-color:var(--gold);}
  .fcard .cat{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
  .fcard h3{font-size:17px;font-weight:500;line-height:1.35;}
  .fcard p{color:var(--mute);font-size:13px;line-height:1.6;flex:1;}
  .fcard button{align-self:flex-start;}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;}
  .chip{border:1px solid var(--line);background:none;color:var(--mute);padding:8px 16px;border-radius:999px;font-size:13px;cursor:pointer;transition:.2s;}
  .chip:hover{color:var(--paper);border-color:var(--mute);}
  .chip.on{color:var(--ink);background:var(--paper);border-color:var(--paper);}
  #q{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;outline:none;}
  #q:focus{border-color:var(--gold);}
  #count{color:var(--mute);font-size:13px;white-space:nowrap;}

  .group{margin-bottom:36px;}
  .group h4{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--mute);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:2px;}
  .row{display:flex;gap:14px;align-items:baseline;padding:13px 4px;border-bottom:1px solid #202022;}
  .row .nm{font-size:15px;min-width:0;}
  .row .ds{color:var(--mute);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .qy{color:var(--mute);font-size:12px;white-space:nowrap;}
  .row .add{border:1px solid var(--line);background:none;color:var(--mute);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1;flex:0 0 auto;align-self:center;transition:.2s;}
  .row .add:hover{color:var(--gold);border-color:var(--gold);}
  .row .add.in{color:var(--ink);background:var(--gold);border-color:var(--gold);}
  @media(max-width:640px){.row{flex-wrap:wrap;}.row .ds{white-space:normal;width:100%;order:3;}}

  button.gold{background:var(--gold);color:#ffffff;border:none;padding:10px 18px;font-size:13px;font-weight:500;border-radius:4px;cursor:pointer;}
  button.ghost{background:none;border:1px solid var(--line);color:var(--paper);padding:9px 18px;font-size:13px;border-radius:4px;cursor:pointer;}

  #bar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:14px 24px;display:none;align-items:center;gap:16px;z-index:50;}
  #bar.show{display:flex;}
  #bar .n{font-size:14px;}
  #bar .n b{color:var(--gold);font-weight:500;}
  #panel{position:fixed;bottom:64px;right:20px;left:auto;width:min(420px,calc(100vw - 40px));max-height:55vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;display:none;z-index:51;}
  #panel.show{display:block;}
  #panel h5{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
  #panel .pi{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid #26262a;}
  #panel .pi span{color:var(--mute);cursor:pointer;}
  #panel textarea{display:none;}
</style>
</head>

var cats=[]; DATA.forEach(function(d){ if(cats.indexOf(d.k)<0) cats.push(d.k); });
var state={cat:null,q:''};
var cart={};

var chips=document.getElementById('chips');
var allChip=document.createElement('button');
allChip.className='chip on'; allChip.textContent='All';
allChip.onclick=function(){state.cat=null;refreshChips();render();};
chips.insertBefore(allChip, chips.firstChild);
cats.forEach(function(c,i){
  var b=document.createElement('button');b.className='chip';b.textContent=c;
  b.onclick=function(){state.cat=(state.cat===c?null:c);refreshChips();render();};
  b.dataset.cat=c;
  chips.insertBefore(b, document.getElementById('q'));
});
function refreshChips(){
  [].forEach.call(chips.querySelectorAll('.chip'),function(b){
    b.classList.toggle('on', state.cat? b.dataset.cat===state.cat : b===allChip);
  });
}
document.getElementById('q').addEventListener('input',function(e){state.q=e.target.value.toLowerCase();render();});

function key(d){return d.k+'|'+d.n;}
function toggle(d,btn){
  var k=key(d);
  if(cart[k]){delete cart[k];}else{cart[k]=d;}
  if(btn)btn.classList.toggle('in',!!cart[k]);
  bar();
}
function bar(){
  var n=Object.keys(cart).length;
  document.getElementById('bn').textContent=n;
  document.getElementById('bar').classList.toggle('show',n>0);
  if(n===0)document.getElementById('panel').classList.remove('show');
  var pi=document.getElementById('pitems');pi.innerHTML='';
  Object.keys(cart).forEach(function(k){
    var d=cart[k];
    var div=document.createElement('div');div.className='pi';
    div.innerHTML='<div>'+d.n+'</div>';
    var x=document.createElement('span');x.textContent='remove';
    x.onclick=function(){toggle(d);render();};
    div.appendChild(x);pi.appendChild(div);
  });
}
document.getElementById('view').onclick=function(){document.getElementById('panel').classList.toggle('show');};
document.getElementById('send').onclick=function(){
  var lines=Object.keys(cart).map(function(k){return '- '+cart[k].n+(cart[k].d?' ('+cart[k].d+')':'');});
  var body='Hello Apparatus,%0D%0A%0D%0AWe would like a quote for the following equipment:%0D%0A%0D%0A'+encodeURIComponent(lines.join('\n')).replace(/%0A/g,'%0D%0A')+'%0D%0A%0D%0AShoot dates:%0D%0AProduction:%0D%0A';
  location.href='mailto:rental@apparatus.ge?subject=Quote request — '+Object.keys(cart).length+' items&body='+body;
};

function fcard(d){
  var el=document.createElement('div');el.className='fcard';
  var icon='<i class="ti '+(d.i||'ti-camera')+'" aria-hidden="true"></i>';
  var media = d.img ? '<img src="'+d.img+'" alt="'+d.n+'" onerror="this.parentNode.innerHTML=this.dataset.fb" data-fb=\''+icon+'\'>' : icon;
  el.innerHTML='<div class="ph">'+media+'</div>';
  var body=document.createElement('div');body.className='fbody';
  body.innerHTML='<span class="cat">'+d.k+'</span><h3>'+d.n+'</h3><p>'+(d.d||'')+'</p>';
  var b=document.createElement('button');b.className='ghost';b.textContent='Add to quote';
  b.onclick=function(){toggle(d,null);b.textContent=cart[key(d)]?'Added ✓':'Add to quote';render();};
  if(cart[key(d)])b.textContent='Added ✓';
  body.appendChild(b);el.appendChild(body);return el;
}
function render(){
  var feat=document.getElementById('feat');feat.innerHTML='';
  DATA.filter(function(d){return d.f;}).forEach(function(d){feat.appendChild(fcard(d));});

  var list=document.getElementById('list');list.innerHTML='';
  var shown=0, bySub={};
  DATA.forEach(function(d){
    if(state.cat && d.k!==state.cat)return;
    if(state.q && (d.n+' '+d.d+' '+d.s+' '+d.k).toLowerCase().indexOf(state.q)<0)return;
    var g=d.k+' — '+d.s;
    (bySub[g]=bySub[g]||[]).push(d);shown++;
  });
  Object.keys(bySub).forEach(function(g){
    var grp=document.createElement('div');grp.className='group';
    grp.innerHTML='<h4>'+g+'</h4>';
    bySub[g].forEach(function(d){
      var r=document.createElement('div');r.className='row';
      r.innerHTML='<div class="nm">'+d.n+'</div><div class="ds">'+(d.d||'')+'</div><div class="qy">×'+d.q+'</div>';
      var b=document.createElement('button');b.className='add'+(cart[key(d)]?' in':'');b.textContent='+';
      b.setAttribute('aria-label','Add '+d.n+' to quote list');
      b.onclick=function(){toggle(d,b);};
      r.appendChild(b);grp.appendChild(r);
    });
    list.appendChild(grp);
  });
  document.getElementById('count').textContent=shown+' items';
  bar();
}
