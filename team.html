<style>
  :root{--ink:#0c0c0d;--panel:#161617;--paper:#f0f0f0;--red:#ED1C24;--mute:#98958c;--line:#2a2a2c;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--ink);color:var(--paper);font-family:'Space Grotesk',"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-weight:300;}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(12,12,13,.95);backdrop-filter:blur(8px);z-index:40;}
  header svg{height:18px;color:var(--paper);}
  main{max-width:1180px;margin:0 auto;padding:48px 24px 100px;}
  .eyebrow{color:var(--red);font-size:12px;letter-spacing:4px;text-transform:uppercase;}
  h1{font-size:clamp(26px,4vw,44px);font-weight:400;margin:14px 0 10px;}
  .lead{color:var(--mute);font-size:16px;line-height:1.7;max-width:640px;margin-bottom:46px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
  .tc{border:1px solid var(--line);background:var(--panel);transition:border-color .25s;}
  .tc:hover{border-color:var(--red);}
  .tp{aspect-ratio:3/4;background:#101011;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line);}
  .tp img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(100%);transition:filter .35s;}
  .tc:hover .tp img{filter:none;}
  .tp span{color:#3a3a3c;font-size:34px;}
  .tb{padding:15px 16px 17px;}
  .tb h3{font-size:16px;font-weight:500;}
  .tb p{color:var(--mute);font-size:13px;margin-top:3px;}
  footer{border-top:1px solid var(--line);padding:56px 24px;text-align:center;}
  footer p{color:var(--mute);font-size:14px;line-height:1.7;}
  footer a{color:var(--paper);text-decoration:none;border-bottom:1px solid var(--red);}
</style>

<script>
var TEAM=[
  {n:"Levan Maghradze",r:"Managing Director",img:"photos/team-levan.jpg"}
];
var g=document.getElementById('grid');
TEAM.forEach(function(m){
  var d=document.createElement('div');d.className='tc';
  var ph=document.createElement('div');ph.className='tp';
  var img=new Image();img.loading='lazy';img.src=m.img;img.alt=m.n;
  img.onerror=function(){ph.innerHTML='<span>+</span>';};
  ph.appendChild(img);
  d.appendChild(ph);
  d.insertAdjacentHTML('beforeend','<div class="tb"><h3>'+m.n+'</h3><p>'+m.r+'</p></div>');
  g.appendChild(d);
});
